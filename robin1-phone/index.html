<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누군가의 아이폰</title>
<meta property="og:title" content="누군가의 아이폰">
<meta property="og:description" content="누군가의 휴대폰. 잠금을 풀고 열어 보세요.">
<meta property="og:type" content="website">
<meta name="description" content="누군가의 휴대폰. 잠금을 풀고 열어 보세요.">
<meta name="twitter:card" content="summary">
<script>
/* 내용은 여기서 바꾸면 돼요 */
/* ───────────────────────────────────────────────────────────
   지금은 '새 폰' 상태예요. 대화·연락처·사진·메모·일정이 모두 비어 있어요.
   글자만 채우면 돼요. 따옴표("")와 쉼표(,)는 지우지 마세요.
   · from: "나" 는 휴대폰 주인이 보낸 말이에요.
   · time 은 24시간제("14:05")로 쓰면 화면에는 "오후 2:05"로 보여요.
   · unread 는 '안 읽은 개수'예요. 그 대화의 마지막 N개(상대가 보낸 것)가 안 읽은 메시지가 돼요.
   · 잠금화면 알림은 안 읽은 메시지·부재중 전화로 자동으로 만들어져요(가장 최근 것이 맨 위).
   ─────────────────────────────────────────────────────────── */
const DATA = {
  /* 페이지 기본 */
  page: {
    title: "누군가의 아이폰",               // 브라우저 탭 제목 · 링크 미리보기 제목
    description: "누군가의 휴대폰. 잠금을 풀고 열어 보세요.", // 링크 미리보기 설명
    caption: ""                            // 폰 위쪽 작은 문구 (비우면 안 보여요)
  },

  /* 휴대폰 주인 (비워 두면 이름이 안 보여요) */
  owner: {
    name: "",          // 연락처 '내 카드'에 보일 이름
    display: ""        // 켤 때(부팅 화면) 보일 이름
  },

  /* 시간 · 날짜 · 배터리
     time 을 "" 로 두면 보는 사람의 실제 지금 시각·날짜가 나와요.
     정해진 시각을 쓰려면 time: "14:07", year: 2026, month: 10, day: 20 처럼 적어요. */
  clock: { time: "", year: 2026, month: 10, day: 25, battery: 86 },

  /* 날씨 (before = 처음 보이는 날씨, after = 이야기 연출로 바뀔 때만 써요) */
  weather: {
    place: "서울",
    before: { temp: 16, text: "맑음", hi: 19, lo: 9, dust: "좋음" },
    after:  { temp: 16, text: "맑음", hi: 19, lo: 9, dust: "좋음" }
  },

  /* 잠금 암호 · 힌트 */
  passcode: "0000",
  hint: "한 번도 안 바꿨어",
  hintAfter: 4,                         // 몇 번 틀리면 힌트가 보일지

  /* 켜자마자 알림이 우르르 쏟아지는 연출 (false = 끔) */
  notifFlood: false,

  /* 이야기 상대(A). 비워 두면 이야기 연출이 없어요.
     이름을 적고 같은 이름의 카톡방·연락처를 만들면, 그 사람과의 통화·카톡 연출이 켜져요. */
  A: { name: "", phone: "", color: "#6F9BD1" },

  /* 홈 화면 앱 (순서대로 4개씩 두 줄). key는 바꾸지 말고 label만 바꾸세요 */
  apps: [
    { key: "map", label: "지도" }, { key: "naver", label: "네이버" }, { key: "memo", label: "메모" }, { key: "gallery", label: "사진" },
    { key: "sms", label: "메시지" }, { key: "kakao", label: "카톡" }, { key: "phone", label: "전화" }, { key: "calendar", label: "캘린더" }
  ],

  /* ── 문자(메시지 앱) ──  예시 형식:
     { id: "s_1", name: "엄마", unread: 1, replies: ["내가 보내면 오는 답장"], messages: [
       { date: "2026년 10월 25일 일요일" },
       { from: "엄마", time: "09:10", text: "밥 먹었니" },
       { from: "나", time: "09:12", text: "응!" }
     ]}, */
  sms: [],

  /* ── 카톡 ── (group: true 는 단톡방, members 는 인원 수)  형식은 문자와 같아요.
     반응: react: "heart" 또는 "check" / 삭제된 메시지: deleted: true */
  kakao: [],

  /* ── 카톡 프로필 · 친구 ──
     내 상태메시지와 카톡 친구 목록이에요. 연락처에 있는 사람은 자동으로 친구에 들어가요.
     친구 예: { name: "지민", status: "상태메시지", birthday: "10-31", fav: true } (birthday 는 월-일, 오늘이면 '생일인 친구'에 떠요) */
  kakaoMe: { status: "" },
  kakaoFriends: [],

  /* ── 연락처 ── (fav: true 는 즐겨찾기)
     { name: "엄마", phone: "010-0000-0000", memo: "", fav: true }
     · 그 사람 이름의 음성 파일(예: 엄마.mp3)을 보내 주면, 걸었을 때 목소리가 처음부터 끝까지 나오고 끝나면 저절로 끊겨요.
     · 음성 파일이 없는 사람·모르는 번호는 '통화 연결이 되지 않아요' */
  contacts: [],

  /* ── 전화 기록 ── type: missed(부재중) / in(수신) / out(발신), count: 몇 번, dur: 통화 시간
     { name: "엄마", type: "in", count: 1, date: "2026-10-24", time: "21:50", dur: "6분 21초" } */
  calls: [],

  /* ── 사진(갤러리) ── 사진을 보내 주면 넣어 드려요
     { img: "사진이름표", title: "제목", place: "장소", date: "2026-10-20", time: "07:02" } */
  gallery: [],

  /* ── 메모 ── checklist 가 있으면 체크리스트, body 는 자유 글 (줄바꿈은 \n)
     { title: "할 일", date: "2026-10-25", checklist: [{ done: false, text: "장보기" }] }
     { title: "제목", date: "2026-10-25", time: "21:30", body: "내용" }   (time 은 있어도 없어도 돼요) */
  memos: [],

  /* ── 지도 ── x, y 는 지도 위 위치(0~2400). 현재 위치는 here
     저장한 장소 예: { name: "카페", address: "주소", memo: "", x: 1500, y: 1250 } */
  map: {
    here: { name: "내 위치", address: "현재 위치", x: 1180, y: 1150 },
    saved: [],
    labels: []   // 지도 위 동네 이름 예: { name: "연남동", x: 900, y: 1000 }
  },

  /* ── 네이버 최근 검색어 (오래된 것 → 최근 순) · 오늘의 소식 ── */
  naverRecent: [],
  naverNews: [],

  /* ── 캘린더 ── 여러 날 일정은 start~end, 하루 일정은 date
     { date: "2026-10-31", time: "12:00", title: "결혼식", place: "" }
     { start: "2026-10-27", end: "2026-10-29", title: "출장", allDay: true, place: "" } */
  calendar: {
    events: [],
    holidays: {
      "2026-08-15": "광복절", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절"
    }
  },

  /* ── 이야기 연출 대사 ── (A가 비어 있으면 쓰이지 않아요) */
  script: {
    onOpen: [], choices: [], afterChoice: [],
    call1: [], tearLine: "", hangupLines: [],
    missedReact: [], noCallback: [],
    locationAsk: [], locationNag: [], afterLocation: [],
    payment: null,
    call2: [],
    finalMessages: [], finalTime: "",
    // 목소리: 이야기 통화 대사 파일 이름 = call1_01, call1_02 … / hangup_01 … / call2_01 …
    dialSeconds: 2,             // 내가 걸 때 '뚜르르' 신호음이 나오는 시간
    ringSeconds: 3,
    callbackWait: 20,
    locationWait: 3
  }
};

</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 레이아웃: 차분한 회색 바탕 가운데에 아이폰 한 대. 폰 안쪽은 402×874(아이폰 18 Pro 기준 pt) 캔버스를 통째로 확대·축소 */
:root{
  --page:#D9DBDE; --page-ink:#4A4F57; --page-soft:#7A8089;
  --ios-blue:#0A84FF; --ios-red:#FF3B30; --ios-green:#34C759; --ios-gray:#8E8E93;
  --ios-bg:#F2F2F7; --ios-line:#D9D9DE; --ink:#111; --sub:#6C6C70;
  --kakao-bg:#B9CBDD; --kakao-me:#FEE500; --kakao-ink:#1E1E1E;
  --naver:#03B85A;
  --px:1.4em;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;color:inherit}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#caption{font-size:13px;letter-spacing:.08em;color:var(--page-soft);font-weight:500;height:18px;line-height:18px}
#guide{font-size:13px;color:var(--page-ink);height:18px;line-height:18px;text-align:center;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#offBtn{height:36px;padding:0 18px;border-radius:18px;border:1px solid #B8BCC2;background:#ECEDEF;color:#3B4047;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
#offBtn:hover{background:#F4F5F6}
#offBtn:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}
#offBtn[disabled]{opacity:.45;cursor:default}
#btnRow{height:36px;display:flex;align-items:center;justify-content:center}

#phoneWrap{position:relative;flex:none}
#buzz{position:absolute;left:0;top:0}
#buzz.on{animation:buzz .09s linear infinite}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(var(--amp,0px),calc(var(--amp,0px)*-.5))}50%{transform:translate(0,var(--amp,0px))}75%{transform:translate(calc(var(--amp,0px)*-1),0)}100%{transform:translate(0,0)}}
#phone{position:absolute;left:0;top:0;width:426px;height:898px;transform-origin:0 0;border-radius:66px;
  background:linear-gradient(145deg,#C9CBCF,#8F9399 40%,#B5B8BD 60%,#7D8187);box-shadow:0 30px 60px -20px rgba(30,34,40,.45),0 2px 6px rgba(0,0,0,.2)}
#phone::before{content:"";position:absolute;inset:3px;border-radius:63px;background:#0B0B0C}
.sidebtn{position:absolute;background:#9A9EA4;border-radius:2px}
#screen{position:absolute;left:12px;top:12px;width:402px;height:874px;border-radius:54px;overflow:hidden;background:#000;
  font-size:15px;color:var(--ink);user-select:none;-webkit-user-select:none;isolation:isolate}
#screen *{box-sizing:border-box}
.layer{position:absolute;inset:0}

/* 공통 상단·하단 */
#status{position:absolute;left:0;right:0;top:0;height:54px;z-index:88;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 46px;pointer-events:none;color:#fff;transition:color .25s}
#status.dark{color:#000}
#status .t{font-size:16.5px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;width:56px;text-align:center}
#status .r{display:flex;gap:6px;align-items:center}
#status svg{display:block}
#island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:89;pointer-events:none}
#homebar{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:58;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;cursor:pointer}
#homebar i{display:block;width:140px;height:5px;border-radius:3px;background:#fff;transition:background .25s}
#homebar.dark i{background:#000}

/* 꺼진 화면 · 부팅 */
#vOff{background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:70}
#vOff span{color:#fff;opacity:.28;font-size:14px;letter-spacing:.06em}
#vOff.hint span{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.12}}
#vBoot{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:69;color:#fff}
.ring{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#vBoot .nm{font-size:17px;font-weight:500;letter-spacing:.04em;opacity:.9}
#offCurtain{position:absolute;inset:0;background:#000;z-index:99;opacity:0;pointer-events:none}
#offCurtain.go{animation:offgo .45s ease-in forwards}
@keyframes offgo{0%{opacity:0}100%{opacity:1}}

/* 바탕화면 */
.wall{position:absolute;inset:0;background-size:cover;background-position:center}

/* 잠금화면 */
#vLock{z-index:20;cursor:pointer;color:#fff}
#vLock .wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,0) 30%,rgba(0,0,0,.18))}
.lk-lock{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;opacity:.9}
.lk-date{position:absolute;top:86px;left:0;right:0;text-align:center;font-size:19px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.lk-time{position:absolute;top:104px;left:0;right:0;text-align:center;font-size:96px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.15)}
#lkNotifs{position:absolute;left:10px;right:10px;top:250px;bottom:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
#lkNotifs.scroll{overflow-y:auto;-webkit-mask-image:none;mask-image:none;scrollbar-width:none}
#lkNotifs.scroll::-webkit-scrollbar{display:none}
.nw{height:78px;flex:none;overflow:visible}
.nw.grow{animation:nwGrow .32s cubic-bezier(.2,.8,.2,1) both}
.nw.grow .nc{animation:ncIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes nwGrow{from{height:0}to{height:78px}}
@keyframes ncIn{from{transform:translateY(-34px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.nc{height:70px;border-radius:22px;background:rgba(245,245,247,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111;
  display:flex;gap:11px;align-items:center;padding:0 14px 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nc .ai{width:38px;height:38px;flex:none;border-radius:9px;overflow:hidden}
.nc .ai svg{width:100%;height:100%;display:block}
.nc .tx{flex:1;min-width:0}
.nc .hd{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;line-height:1.3}
.nc .hd b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.nc .hd em{font-style:normal;font-weight:400;font-size:12.5px;color:#55555A;flex:none}
.nc .bd{font-size:14px;line-height:1.35;color:#1c1c1e;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#lkSummary{position:absolute;left:10px;right:10px;top:250px;bottom:96px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none}
#lkSummary::-webkit-scrollbar{display:none}
#lkSummary .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grp{position:relative;cursor:pointer}
.grp .nc{position:relative;z-index:2}
.grp .stk{position:absolute;left:10px;right:10px;bottom:-7px;height:30px;border-radius:18px;background:rgba(245,245,247,.5);z-index:1}
.grp .stk2{left:20px;right:20px;bottom:-13px;background:rgba(245,245,247,.32);z-index:0}
.grp .nc .bd small{color:#55555A;font-size:12.5px;margin-left:4px}
.more{align-self:center;margin-top:8px;padding:7px 15px;border-radius:16px;background:rgba(245,245,247,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#111;font-size:13.5px;font-weight:600;border:0;cursor:pointer}
#lkHint{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:14px;font-weight:500;opacity:0;transition:opacity 1.2s;text-shadow:0 1px 6px rgba(0,0,0,.3)}
#lkHint.on{opacity:.9;animation:breathe2 2.8s ease-in-out 1.2s infinite}
@keyframes breathe2{50%{opacity:.55}}
.lk-corner{position:absolute;bottom:52px;width:50px;height:50px;border-radius:50%;background:rgba(40,40,46,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}

/* 암호 */
#vPass{z-index:30;color:#fff;display:flex;flex-direction:column;align-items:center}
#vPass .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.62) saturate(1.2);transform:scale(1.08)}
#vPass.show{animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pc-top{position:relative;margin-top:150px;text-align:center}
.pc-top .lbl{font-size:19px;font-weight:500}
.dots{display:flex;gap:22px;justify-content:center;margin-top:22px;height:14px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;display:block;transition:background .08s}
.dots i.f{background:#fff}
.dots.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
.pc-msg{position:relative;height:44px;margin-top:14px;font-size:14px;text-align:center;line-height:1.45;padding:0 30px}
.pc-msg .hint{display:block;font-size:13px;opacity:.85}
.keys{position:relative;display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px;margin-top:20px}
.key{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}

.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:9.5px;letter-spacing:.18em;font-weight:600;margin-top:2px;height:11px}

.pc-bot{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:space-between;padding:0 54px;font-size:16px}
.pc-bot button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:6px}

/* 홈 화면 */
#vHome{z-index:10}
#vHome .grid{position:absolute;top:262px;left:22px;right:22px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px}
#vHome.enter .widget,#vHome.enter .app-ic{animation:homeIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes homeIn{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.app-ic .ic{position:relative;width:62px;height:62px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.app-ic .ic svg{width:62px;height:62px;border-radius:15px;display:block}
.app-ic .ic:active{filter:brightness(.8)}
.app-ic .lb{font-size:12px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.55);letter-spacing:-.01em}
.app-ic:focus-visible .ic{outline:2px solid #fff;outline-offset:3px}
.badge{position:absolute;top:-7px;right:-8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--ios-red);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;line-height:1}
.widget{position:absolute;top:70px;left:22px;right:22px;height:162px;border-radius:24px;background:rgba(255,255,255,.26);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  color:#fff;padding:18px 20px;display:flex;justify-content:space-between;box-shadow:0 1px 0 rgba(255,255,255,.2) inset}
.widget .l{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.widget .wt{font-size:54px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.widget .wd{font-size:14px;font-weight:600;opacity:.95;margin-top:6px}
.widget .ev{font-size:12.5px;opacity:.95;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget .ev i{width:3px;height:14px;border-radius:2px;background:#FFD60A;flex:none}
.widget .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;text-align:right}
.widget .wplace{font-size:13px;font-weight:600}
.widget .wtemp{font-size:34px;font-weight:500;line-height:1}
.widget .wtxt{font-size:13px;font-weight:600}
.widget .whl{font-size:12px;opacity:.9}
.wxic{width:56px;height:46px;position:relative}
.wxic svg{position:absolute;inset:0;overflow:visible}
.wx-sun{transform-origin:28px 22px;opacity:0}
.wx-cloud{opacity:1}
.wx.clear .wx-sun{opacity:1}
.wx.clear .wx-cloud{opacity:0}
.wx.clearing .wx-cloud{animation:cloudAway 2.2s ease-in forwards}
.wx.clearing .wx-sun{animation:sunUp 2.2s cubic-bezier(.2,.7,.2,1) .5s both}
.wx.clear .wx-rays{animation:spin 18s linear infinite;transform-origin:28px 22px}
@keyframes cloudAway{0%{transform:translateX(0);opacity:1}100%{transform:translateX(70px);opacity:0}}
@keyframes sunUp{0%{transform:translateY(26px) rotate(-120deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.wswap{display:inline-block}
.wswap.chg{animation:wswap 1.6s ease both}
@keyframes wswap{0%{opacity:1;filter:blur(0)}40%{opacity:0;filter:blur(3px)}60%{opacity:0;filter:blur(3px)}100%{opacity:1;filter:blur(0)}}
.pg-dots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.pg-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.pg-dots i.on{background:#fff}
.h-search{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}

/* 앱 공통 */
#vApp{z-index:40;background:#fff;overflow:hidden}
#vApp.open{animation:appOpen .34s cubic-bezier(.2,.8,.2,1) both}
#vApp.close{animation:appClose .26s ease-in both}
@keyframes appOpen{from{transform:scale(.3);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
@keyframes appClose{to{transform:scale(.3);opacity:0}}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.pane.push{animation:push .32s cubic-bezier(.2,.8,.2,1) both}
.pane.pop{animation:popIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes popIn{from{transform:translateX(-24%);opacity:.6}to{transform:none;opacity:1}}
.top{padding-top:54px;flex:none}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--px) - 8px);position:relative}
.nav .ttl{position:absolute;left:70px;right:70px;text-align:center;font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.back{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--ios-blue);font-size:16.5px;cursor:pointer;padding:6px 6px 6px 2px;min-height:40px;position:relative;z-index:2}
.back svg{flex:none}
.navbtn{background:none;border:0;color:var(--ios-blue);font-size:16px;cursor:pointer;padding:6px;min-height:40px;display:flex;align-items:center;gap:4px;position:relative;z-index:2}
.bigttl{font-size:32px;font-weight:800;letter-spacing:-.02em;padding:2px var(--px) 8px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.bottom-safe{height:34px;flex:none}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;background:#A7B0BC;overflow:hidden}
.avatar svg{width:62%;height:62%}
.searchbar{margin:4px var(--px) 8px;height:36px;border-radius:10px;background:#EEEEF0;display:flex;align-items:center;gap:6px;padding:0 9px;color:#8A8A8E;font-size:15.5px}

/* 목록 (메시지 · 카톡 · 전화 공통) */
.row{display:flex;align-items:center;gap:12px;padding:10px var(--px);cursor:pointer;position:relative;min-width:0}
.row:active{background:#ECECEF}
.row .mid{flex:1;min-width:0;padding-bottom:1px}
.row .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;min-width:0}
.row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--sub);font-weight:400;font-size:13px;flex:none}
.row .pv{color:var(--sub);font-size:14px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:2px;flex:none}
.row .rt time{color:var(--sub);font-size:13px;white-space:nowrap}
.row .ub{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#FF4B3E;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sep{height:1px;background:var(--ios-line);margin-left:calc(var(--px) + 58px)}
.dotu{position:absolute;left:6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--ios-blue)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #C7C7CC;flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ios-blue);border-color:var(--ios-blue)}

/* 메시지 대화 */
.sms-head{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:8px;border-bottom:1px solid #E5E5EA;background:rgba(249,249,251,.96)}
.sms-head .nm{font-size:12px;color:#111;display:flex;align-items:center;gap:2px}
.sms-head .nav{width:100%}
.thread{padding:10px var(--px) 12px;display:flex;flex-direction:column}
.dsep{align-self:center;font-size:12px;color:var(--sub);margin:16px 0 10px;font-weight:500;text-align:center}
.b{max-width:76%;padding:8px 13px;border-radius:19px;font-size:15.5px;line-height:1.4;word-break:break-word;white-space:pre-wrap;position:relative;cursor:pointer}
.b.in{background:#E9E9EB;color:#111;align-self:flex-start}
.b.out{background:var(--ios-blue);color:#fff;align-self:flex-end}
.b.gapS{margin-top:2px}.b.gapL{margin-top:10px}
.b.tailin{border-bottom-left-radius:6px}.b.tailout{border-bottom-right-radius:6px}
.stamp{font-size:11.5px;color:var(--sub);margin-top:3px}
.stamp.in{align-self:flex-start;margin-left:6px}.stamp.out{align-self:flex-end;margin-right:6px}
.pop{animation:bpop .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes bpop{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.inputbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px calc(var(--px) - 6px) 6px;background:#fff}
.inputbar input{flex:1;min-width:0;height:36px;border-radius:18px;border:1px solid #D1D1D6;padding:0 14px;font-family:inherit;font-size:15px;outline:none;background:#fff}
.inputbar input:focus{border-color:#AFAFB4}
.circbtn{width:34px;height:34px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:#E9E9EB}
.circbtn.blue{background:var(--ios-blue)}
.editbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px var(--px) 4px;border-top:1px solid #E5E5EA;background:#F9F9FB}
.editbar button{background:none;border:0;font-size:16px;color:var(--ios-blue);cursor:pointer;padding:6px 0}
.editbar button[disabled]{color:#C7C7CC}

/* 말풍선 메뉴 · 확인창 · 토스트 · 배너 */
#menu{position:absolute;z-index:90;background:rgba(250,250,252,.98);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);overflow:hidden;min-width:150px}
#menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;border:0;background:none;font-size:15.5px;cursor:pointer;gap:20px}
#menu button+button{border-top:1px solid #E5E5EA}
#menu .red{color:var(--ios-red)}
#scrim{position:absolute;inset:0;z-index:89;background:rgba(0,0,0,.0)}
#scrim.dim{background:rgba(0,0,0,.32);animation:fadeIn .2s both}
#dialog{position:absolute;z-index:91;left:50%;top:50%;width:270px;margin-left:-135px;transform:translateY(-50%);background:rgba(246,246,248,.98);border-radius:16px;overflow:hidden;text-align:center;animation:dlg .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes dlg{from{transform:translateY(-50%) scale(1.12);opacity:0}to{transform:translateY(-50%);opacity:1}}
#dialog .dt{padding:20px 16px 4px;font-weight:700;font-size:16.5px}
#dialog .dm{padding:0 18px 18px;font-size:13.5px;line-height:1.45;color:#333}
#dialog .db{display:flex;border-top:1px solid #DADADF}
#dialog .db button{flex:1;padding:12px 0;border:0;background:none;font-size:16.5px;color:var(--ios-blue);cursor:pointer}
#dialog .db button+button{border-left:1px solid #DADADF}
#dialog .db .red{color:var(--ios-red);font-weight:600}
#toast{position:absolute;z-index:95;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(30,30,32,.86);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:18px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;animation:toast 2.2s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
#banner{position:absolute;z-index:96;left:10px;right:10px;top:8px;cursor:pointer}
#banner .nc{background:rgba(250,250,252,.94);box-shadow:0 8px 26px rgba(0,0,0,.2)}
#banner.in{animation:bnIn .45s cubic-bezier(.2,.9,.3,1.1) both}
#banner.out{animation:bnOut .3s ease-in both}
@keyframes bnIn{from{transform:translateY(-120%)}to{transform:none}}
@keyframes bnOut{to{transform:translateY(-130%)}}

/* 카톡 */
.k-list .top{background:#fff}
.k-tabs{flex:none;height:50px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #EFEFEF;background:#fff}
.ktab{width:64px;height:44px;border:0;background:none;color:#B5B5B5;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ktab svg{width:25px;height:25px}
.ktab.on{color:#111}
.k-ttl .ic{align-items:center}
.kic{border:0;background:none;padding:4px;cursor:pointer;color:#111;display:flex}
.k-div{height:1px;background:#EFEFEF;margin:6px var(--px)}
.k-sec{font-size:12.5px;color:#8A8A8A;padding:10px var(--px) 4px}
.kfr{padding-top:8px;padding-bottom:8px}
.k-more{display:grid;grid-template-columns:repeat(4,1fr);row-gap:18px;padding:16px var(--px)}
.k-more button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#333;cursor:pointer}
.k-more i{width:46px;height:46px;border-radius:16px;background:#F4F4F4;display:flex;align-items:center;justify-content:center}
/* 카톡 프로필 */
.kprof{position:absolute;inset:0;z-index:8;color:#fff;display:flex;flex-direction:column;animation:kpUp .28s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.kprof.out{animation:kpDown .22s ease-in both}
@keyframes kpUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes kpDown{to{transform:translateY(100%)}}
.kp-bg{position:absolute;inset:0}
.kp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,0) 30%,rgba(0,0,0,.35))}
.kp-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:58px calc(var(--px) - 6px) 0}
.kp-top button{border:0;background:none;cursor:pointer;padding:6px;display:flex}
.kp-ti{display:flex;gap:8px}
.kp-mid{position:relative;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 var(--px) 22px;text-align:center}
.kp-av{border-radius:38%!important;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:40px!important}
.kp-nm{font-size:20px;font-weight:700;margin-top:6px}
.kp-st{font-size:14px;opacity:.85;min-height:20px;max-width:100%;word-break:keep-all;display:flex;gap:6px;align-items:center;justify-content:center}
.kp-st input{width:220px;max-width:70vw;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;padding:0 10px;font-family:inherit;font-size:14px;outline:none}
.kp-st button{height:34px;padding:0 12px;border-radius:8px;border:0;background:#FEE500;color:#3A1D1D;font-weight:700;font-size:13px;cursor:pointer}
.kp-line{position:relative;height:1px;background:rgba(255,255,255,.22);margin:0 var(--px)}
.kp-btns{position:relative;display:flex;justify-content:space-around;padding:18px var(--px) 54px}
.kp-btns button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;width:84px}
.kp-btns i{height:28px;display:flex;align-items:center}
.k-ttl{display:flex;justify-content:space-between;align-items:center;padding:0 var(--px) 8px;font-size:21px;font-weight:800}
.k-ttl .ic{display:flex;gap:16px}
.kav{border-radius:38%;}
.k-room{background:var(--kakao-bg)}
.k-room .top{background:var(--kakao-bg)}
.k-room .nav .ttl{font-weight:600}
.k-room .nav .ttl small{font-weight:500;color:#4D5662;margin-left:4px;font-size:14px}
.k-room .back{color:#222}
.k-room .navbtn{color:#222}
.kthread{padding:6px var(--px) 12px;display:flex;flex-direction:column}
.kdsep{align-self:center;margin:14px 0 10px;background:rgba(0,0,0,.12);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;display:flex;align-items:center;gap:5px}
.km{display:flex;gap:8px;align-items:flex-start}
.km.me{flex-direction:row-reverse}
.km .sp{width:38px;flex:none}
.km .kav{width:38px;height:38px}
.km .col{display:flex;flex-direction:column;min-width:0;max-width:72%}
.km.me .col{align-items:flex-end}
.km .who{font-size:12.5px;color:#3C4550;margin:0 0 4px 2px}
.km .line{display:flex;align-items:flex-end;gap:5px;min-width:0}
.km.me .line{flex-direction:row-reverse}
.kb{padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.42;background:#fff;color:var(--kakao-ink);word-break:break-word;white-space:pre-wrap;min-width:0;position:relative}
.km.me .kb{background:var(--kakao-me)}
.km.first:not(.me) .kb{border-top-left-radius:4px}
.km.first.me .kb{border-top-right-radius:4px}
.km .meta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.km:not(.me) .meta{align-items:flex-start}
.km .meta time{font-size:10.5px;color:#4D5662;white-space:nowrap}
.km .meta .one{font-size:11px;color:#E8B600;font-weight:700}
.km.gS{margin-top:4px}.km.gL{margin-top:12px}
.kb.del{color:#7B848F;display:flex;align-items:center;gap:5px;font-size:14.5px}
.react{position:absolute;bottom:-9px;right:-5px;height:20px;min-width:20px;padding:0 5px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px}
.km.me .react{right:auto;left:-5px}
.km.hasreact{margin-bottom:8px}
.kloc{width:220px;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer}
.kloc .mp{height:112px;position:relative;overflow:hidden;background:#EEF0EA}
.kloc .mp svg{position:absolute;inset:0;width:100%;height:100%}
.kloc .tx{padding:9px 12px 11px;font-size:13px;line-height:1.4;color:#333}
.kloc .tx b{display:block;font-size:14.5px;color:#111}
.kphoto{width:180px;border-radius:14px;display:block}
.typing{display:flex;gap:4px;padding:12px 13px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AA2AC;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.k-input{flex:none;background:#fff;display:flex;align-items:center;gap:8px;padding:7px calc(var(--px) - 8px) 6px}
.k-input input{flex:1;min-width:0;height:36px;border:0;background:#F3F3F3;border-radius:18px;padding:0 14px;font-family:inherit;font-size:15px;outline:none}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:#F3F3F3;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .2s}
.plus.open{transform:rotate(45deg)}
.plus.blink{animation:plusBlink 1s ease-in-out infinite}
@keyframes plusBlink{0%,100%{background:#F3F3F3;box-shadow:0 0 0 0 rgba(254,229,0,0)}50%{background:var(--kakao-me);box-shadow:0 0 0 6px rgba(254,229,0,.35)}}
.ksend{width:40px;height:34px;border-radius:17px;border:0;background:var(--kakao-me);font-weight:700;font-size:13px;cursor:pointer;flex:none;color:#3A1D1D}
.ksend[disabled]{background:#F3F3F3;color:#B0B0B0}
.k-sheet{flex:none;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);padding:16px var(--px) 18px;border-top:1px solid #EFEFEF;animation:sheetUp .25s ease both}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.k-sheet button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;color:#333}
.k-sheet button i{width:52px;height:52px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.k-sheet button.hl i{animation:plusBlink 1s ease-in-out infinite}
.choices{flex:none;background:#fff;padding:12px var(--px) 8px;display:flex;flex-direction:column;gap:8px;animation:sheetUp .3s ease both}
.choices p{margin:0 0 2px;font-size:12px;color:#7B848F;text-align:center}
.choices button{min-height:44px;border-radius:12px;border:1.5px solid #E2C800;background:#FFFBE0;font-size:15px;font-weight:600;cursor:pointer;padding:8px 12px;color:#3A1D1D}
.choices button:hover{background:#FFF5A8}
.picker{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:12px var(--px) 40px;animation:sheetUp .25s ease both}
.picker .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
.picker .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.picker .pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;display:block}
.locsheet .mp{height:150px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:10px}
.locsheet .mp svg{position:absolute;inset:0;width:100%;height:100%}
.locsheet .ad{font-size:13.5px;color:#444;margin-bottom:12px;line-height:1.4}
.locsheet .go{width:100%;height:46px;border-radius:12px;border:0;background:var(--kakao-me);font-weight:700;font-size:15px;cursor:pointer;color:#3A1D1D}

/* 전화 */
.seg{display:flex;margin:6px auto 4px;background:#EEEEF0;border-radius:9px;padding:2px;width:200px}
.seg button{flex:1;border:0;background:none;padding:6px 0;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;gap:10px;padding:9px var(--px);min-width:0}
.crow .cic{width:16px;flex:none;display:flex;justify-content:center}
.crow .mid{flex:1;min-width:0}
.crow .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nm.miss{color:var(--ios-red)}
.crow .sb{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow time{font-size:13.5px;color:var(--sub);white-space:nowrap;flex:none}
.callbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--ios-green);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.callbtn:active{filter:brightness(.85)}
.csep{height:1px;background:var(--ios-line);margin-left:calc(var(--px) + 26px)}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:6px 6px 0;border-top:1px solid #E5E5EA;background:rgba(249,249,251,.96)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8E8E93;font-weight:500;width:64px}
.tabbar span.on{color:var(--ios-blue)}
.tabbar svg{width:25px;height:25px}

/* 전화 앱 · 키패드 · 연락처 */
.ph-pad{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding-top:46px}
.ph-num{height:48px;font-size:36px;font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:48px}
.ph-who{height:24px;font-size:15px;color:#111;margin-bottom:26px}
.ph-who.add{color:var(--ios-blue)}
.ph-keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 28px}
.ph-key{width:78px;height:78px;border-radius:50%;border:0;background:#E5E5EA;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;color:#111}
.ph-key:active,.ph-key.pr{background:#C7C7CC;transition:none}
.ph-key b{font-size:34px;font-weight:400;line-height:1}
.ph-key small{font-size:9.5px;font-weight:700;letter-spacing:.16em;height:11px;margin-top:2px}
.ph-act{display:grid;grid-template-columns:repeat(3,78px);gap:0 28px;margin-top:16px;align-items:center;justify-items:center}
.ph-call{width:78px;height:78px;border-radius:50%;border:0;background:var(--ios-green);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph-call:active{filter:brightness(.88)}
.ph-del{border:0;background:none;cursor:pointer;padding:8px;display:flex}
.ph-info{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--ios-blue);color:var(--ios-blue);background:none;font:italic 700 13px/1 Georgia,serif;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.ph-me{border-bottom:1px solid var(--ios-line);padding-top:6px;padding-bottom:12px}
.ph-sec{font-size:13px;font-weight:700;color:#8E8E93;background:#F6F6F8;padding:4px var(--px)}
.ph-cr{padding:11px var(--px);font-size:16.5px;font-weight:600;cursor:pointer}
.ph-cr:active{background:#ECECEF}
.ph-line{height:1px;background:var(--ios-line);margin-left:var(--px)}
.ph-count{text-align:center;color:#8E8E93;font-size:13px;padding:18px 0 30px}
.ph-dtop{background:linear-gradient(#DDE3EA,#F2F2F7)}
.ph-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 14px}
.ph-hero .avatar{font-size:40px}
.ph-name{font-size:28px;font-weight:600;letter-spacing:-.01em}
.ph-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 var(--px) 14px}
.ph-btns button{height:58px;border-radius:12px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--ios-blue);cursor:pointer}
.ph-dbody{background:var(--ios-bg)}
.ph-card{margin:0 var(--px) 12px;background:#fff;border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ph-card[role=button]{cursor:pointer}
.ph-card small{font-size:13px;color:#111}
.ph-card span{font-size:16px;word-break:break-all}
.ph-card .ph-tel{color:var(--ios-blue)}
.ph-links{padding:0}
.ph-links span{padding:12px 16px;color:var(--ios-blue);font-size:16px}
.ph-links span+span{border-top:1px solid var(--ios-line)}

/* 통화 화면 */
#vCall{z-index:85;color:#fff;overflow:hidden;background:#1B2330}
#vCall .cbg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 18%,#4A6688 0%,#26354A 45%,#121821 100%)}
#vCall.show{animation:fadeIn .3s both}
.c-top{position:relative;margin-top:96px;text-align:center}
.c-top .cn{font-size:34px;font-weight:500;letter-spacing:-.01em}
.c-top .cs{font-size:16px;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums}
.c-av{position:absolute;left:50%;top:252px;width:120px;height:120px;margin-left:-60px}
.c-av .avatar{position:absolute;inset:0;font-size:46px}
.c-av .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:pulse 1.8s ease-out infinite}
.c-av .pulse:nth-child(2){animation-delay:.6s}.c-av .pulse:nth-child(3){animation-delay:1.2s}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
.c-line{position:absolute;left:30px;right:30px;top:200px;height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;line-height:1.55;font-weight:500;letter-spacing:-.01em;word-break:keep-all;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.c-line span{display:block;animation:lineIn .5s ease both}
@keyframes lineIn{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.c-tap{position:absolute;left:0;right:0;top:432px;text-align:center;font-size:12.5px;opacity:.55;transition:opacity .3s}
.c-grid{position:absolute;left:44px;right:44px;top:478px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:20px;justify-items:center}
.c-grid div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:.95}
.c-grid i{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.c-end{position:absolute;left:50%;bottom:84px;margin-left:-36px;width:72px;height:72px;border-radius:50%;border:0;background:var(--ios-red);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s,filter .3s}
.c-end.off{opacity:.32;filter:grayscale(.4);cursor:default}
.c-inc{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:space-around;padding:0 40px}
.c-inc div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px}
.c-inc button{width:74px;height:74px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.c-inc .no{background:var(--ios-red)}
.c-inc .yes{background:var(--ios-green);animation:jiggle 1.2s ease-in-out infinite}
@keyframes jiggle{0%,60%,100%{transform:none}70%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
.nvwx .wx-cloud path:first-child{fill:#C9D3DE}.nvwx .wx-cloud path:last-child{fill:#B4C0CD}
.c-ended{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:15px;opacity:.85}

/* 눈물 */
#tear{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
.drop{position:absolute;width:22px;height:29px;border-radius:50% 50% 50% 50%/62% 62% 40% 40%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.28) 24%,rgba(220,235,255,.18) 55%,rgba(255,255,255,.55) 78%,rgba(255,255,255,.15) 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.25),inset 0 -2px 3px rgba(255,255,255,.35);backdrop-filter:blur(1.5px) brightness(1.25);-webkit-backdrop-filter:blur(1.5px) brightness(1.25)}
.drop.go{animation:dropFall 1.5s linear forwards}
@keyframes dropFall{
  0%{transform:translateY(-120px) scale(.7,1.15);opacity:0}
  6%{opacity:1}
  24%{transform:translateY(0) scale(.85,1.1)}
  29%{transform:translateY(0) scale(1.25,.78)}
  35%{transform:translateY(0) scale(1,1.02)}
  48%{transform:translateY(0) scale(1,1.04)}
  52%{transform:translateY(7px) scale(.94,1.12)}
  58%{transform:translateY(7px) scale(1,1.05)}
  66%{transform:translateY(7px) scale(1,1.05)}
  70%{transform:translateY(15px) scale(.92,1.15)}
  76%{transform:translateY(15px) scale(.95,1.12)}
  100%{transform:translateY(560px) scale(.72,1.45);opacity:.85}}
.trail{position:absolute;width:10px;border-radius:5px;opacity:.75;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.07) 70%,rgba(255,255,255,0));backdrop-filter:blur(1px) brightness(1.15);-webkit-backdrop-filter:blur(1px) brightness(1.15);transform-origin:top;transform:scaleY(0)}
.trail.go{animation:trailGrow 1.5s linear forwards,trailFade 5s ease 1.6s forwards}
@keyframes trailGrow{0%,70%{transform:scaleY(0)}76%{transform:scaleY(.03)}100%{transform:scaleY(1)}}
@keyframes trailFade{to{opacity:0}}

/* 사진 */
.g-month{font-size:20px;font-weight:800;padding:14px var(--px) 8px}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 var(--px)}
.g-grid button{padding:0;border:0;background:#eee;border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer;display:block;width:100%}
.g-grid img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;z-index:3;animation:fadeIn .2s both}
.viewer .top .back{color:#fff}
.viewer .stagev{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.viewer .stagev img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.viewer .arr{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer}
.viewer .arr[disabled]{opacity:.2;cursor:default}
.viewer .arr.l{left:12px}.viewer .arr.r{right:12px}
.viewer .info{padding:14px var(--px) 48px;text-align:center}
.viewer .info b{display:block;font-size:17px;margin-bottom:4px}
.viewer .info span{font-size:13px;opacity:.75}

/* 메모 */
.m-wrap{background:var(--ios-bg)}
.m-wrap .pane{background:var(--ios-bg)}
.m-card{margin:0 var(--px);background:#fff;border-radius:12px;overflow:hidden}
.m-item{padding:12px 16px;cursor:pointer;min-width:0}
.m-item+.m-item{border-top:1px solid #E5E5EA}
.m-item b{display:block;font-size:16px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-item span{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.m-item span em{font-style:normal;color:#3A3A3C;margin-right:8px}
.m-sec{font-size:13px;color:var(--sub);padding:14px calc(var(--px) + 16px) 6px;font-weight:600}
.m-body{background:#fff}
.scroll.m-body{flex:1}
.m-body .navbtn,.m-body .back{color:#D9A300}
.m-doc{padding:6px var(--px) 30px}
.m-doc .md{font-size:12.5px;color:var(--sub);text-align:center;margin:0 0 12px}
.m-doc h2{font-size:24px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.m-doc p{font-size:16px;line-height:1.65;margin:0;white-space:pre-wrap;word-break:keep-all}
.ck{display:flex;gap:11px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:16px;line-height:1.45}
.ck i{width:22px;height:22px;border-radius:50%;border:1.5px solid #BDBDC2;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s}
.ck.on i{background:#F5B800;border-color:#F5B800}
.ck.on span{color:#9A9AA0;text-decoration:line-through}

/* 지도 */
.mapv{position:absolute;inset:0;overflow:hidden;background:#F1EFE9;touch-action:none;cursor:grab}
.mapv.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:2400px;height:2400px;will-change:transform}
.world.ease{transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin .pl{margin-top:2px;background:#fff;padding:2px 7px;border-radius:9px;font-size:11.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2);white-space:nowrap}
.pin.sel svg{transform:scale(1.25);transform-origin:bottom}
.here{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#1EC871;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.here::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(30,200,113,.22);animation:herePulse 2s ease-out infinite}
@keyframes herePulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
.map-top{position:absolute;left:0;right:0;top:0;padding:60px var(--px) 10px;z-index:3;background:linear-gradient(rgba(255,255,255,.92) 40px,rgba(255,255,255,0))}
.msearch{height:46px;border-radius:23px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14);display:flex;align-items:center;gap:6px;padding:0 14px 0 6px;font-size:14.5px;color:#8A8A8E}
.msearch .back{color:#222;padding:6px}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:nowrap;overflow:hidden}
.chips span{flex:none;height:30px;padding:0 10px;border-radius:15px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14);display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:#333}
.map-fab{position:absolute;z-index:3;width:44px;height:44px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.map-tabs{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid #ECECEC;display:flex;justify-content:space-around;padding:7px 4px 30px}
.map-tabs span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#888;width:60px}
.map-tabs span.on{color:#111;font-weight:700}
.map-tabs svg{width:22px;height:22px}
.savepop{position:absolute;z-index:4;left:var(--px);bottom:164px;width:236px;background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.22);padding:6px 0;animation:sheetUp .2s ease both}
.savepop .sh{font-size:12.5px;font-weight:700;color:#03A04F;padding:6px 14px 4px}
.savepop button{display:flex;width:100%;gap:9px;align-items:center;padding:8px 14px;border:0;background:none;cursor:pointer;text-align:left;min-width:0}
.savepop button:hover{background:#F5F5F5}
.savepop button b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savepop button small{font-size:11.5px;color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placecard{position:absolute;z-index:4;left:var(--px);right:var(--px);bottom:94px;height:52px;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;animation:sheetUp .22s ease both;min-width:0}
.placecard .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#666}
.placecard .pt b{color:#111;font-size:14.5px;margin-right:6px}
.placecard .pb{height:30px;padding:0 10px;border-radius:15px;border:1px solid #D9D9D9;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.placecard .pb.g{background:#03B85A;border-color:#03B85A;color:#fff}
.placecard .px{width:28px;height:28px;border:0;background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}

/* 네이버 */
.nv .nv-top{display:flex;align-items:center;gap:8px;padding:6px var(--px) 10px}
.nv-search{flex:1;height:48px;border:2px solid var(--naver);border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;color:#999;cursor:text;min-width:0;background:#fff}
.nv-search input{flex:1;min-width:0;border:0;outline:none;font-family:inherit;font-size:15.5px;background:none}
.nv-short{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;padding:8px var(--px) 16px}
.nv-short div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#333}
.nv-short i{width:46px;height:46px;border-radius:16px;background:#F3F5F4;display:flex;align-items:center;justify-content:center}
.nv-card{margin:0 var(--px) 12px;border-radius:16px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:16px}
.nv-bg{background:#F2F4F3}
.nv-bg .pane{background:#F2F4F3}
.nv-w{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nv-w .tp{font-size:38px;font-weight:600;line-height:1}
.nv-w .ds{font-size:13px;color:#555;margin-top:6px}
.nv-h{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid #EEE;font-size:12px;color:#555;text-align:center}
.nv-news h3{margin:0 0 6px;font-size:15px}
.nv-news a{display:block;padding:10px 0;border-top:1px solid #F0F0F0;text-decoration:none;color:#222;font-size:14.5px;line-height:1.4}
.nv-news a:first-of-type{border-top:0}
.nv-news small{display:block;color:#999;font-size:12px;margin-top:2px}
.nv-rh{display:flex;justify-content:space-between;align-items:center;padding:6px var(--px) 8px;font-size:13.5px;color:#555}
.nv-rh button{background:none;border:0;color:#888;font-size:13px;cursor:pointer;padding:4px}
.nv-r{display:flex;align-items:center;gap:10px;padding:11px var(--px);font-size:15px;min-width:0}
.nv-r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv-r time{font-size:12px;color:#AAA;flex:none}
.nv-r button{border:0;background:none;cursor:pointer;padding:4px;flex:none;display:flex}
.nv-empty{padding:60px var(--px);text-align:center;color:#999;font-size:14px}

/* 캘린더 */
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:4px var(--px) 8px}
.cal-h h2{margin:0;font-size:26px;font-weight:800}
.cal-h h2 small{font-size:15px;color:var(--ios-red);font-weight:700;margin-left:6px}
.cal-h .ctl{display:flex;gap:4px;align-items:center}
.cal-h .ctl button{border:0;background:none;cursor:pointer;color:var(--ios-red);font-size:15px;padding:6px 8px;display:flex;align-items:center}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);padding:0 calc(var(--px) - 10px);font-size:11.5px;color:#8E8E93;text-align:center;border-bottom:1px solid #E5E5EA;padding-bottom:5px}
.cal-wd span:first-child{color:var(--ios-red)}.cal-wd span:last-child{color:#2F7CF6}
.cal-g{padding:0 calc(var(--px) - 10px)}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:56px;border-bottom:1px solid #F0F0F3}
.dc{display:flex;flex-direction:column;align-items:center;padding-top:5px;cursor:pointer;background:none;border:0;font-size:15px;color:#111;min-width:0}
.dc .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.dc.sun .n,.dc.hol .n{color:var(--ios-red)}
.dc.sat .n{color:#2F7CF6}
.dc.out .n{opacity:.3}
.dc.today .n{background:var(--ios-blue);color:#fff;font-weight:700}
.dc.sel:not(.today) .n{background:#111;color:#fff}
.dc .dt{width:5px;height:5px;border-radius:50%;background:#A0A0A8;margin-top:auto;margin-bottom:6px}
.band{position:absolute;top:36px;height:15px;border-radius:4px;background:#C9E4FF;color:#0A5BC4;font-size:10px;font-weight:700;line-height:15px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.band.cs{border-top-left-radius:0;border-bottom-left-radius:0}
.band.ce{border-top-right-radius:0;border-bottom-right-radius:0}
.band.c2{background:#FFE1C2;color:#B35400}
.cal-list{padding:12px var(--px) 30px}
.cal-list h4{margin:0 0 10px;font-size:14px;color:#555;font-weight:700}
.cal-list .hn{color:var(--ios-red);font-size:13px;margin-left:6px}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid #F0F0F3;min-width:0}
.ev i{width:4px;border-radius:2px;background:var(--ios-blue);flex:none}
.ev.c2 i{background:#FF9F0A}
.ev .et{width:52px;flex:none;font-size:13px;color:#555;line-height:1.4}
.ev .eb{flex:1;min-width:0}
.ev .eb b{display:block;font-size:15px}
.ev .eb small{font-size:12.5px;color:#888}
.cal-none{color:#999;font-size:14px;padding:6px 0}

@media (prefers-reduced-motion: reduce){
  #screen *, #screen *::before, #screen *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #buzz.on{animation:none}
  .drop.go{animation:none;opacity:0}
}

/* 메모 쓰기 */
.m-ti{display:block;width:100%;border:0;outline:none;background:none;font-family:inherit;font-size:24px;font-weight:800;letter-spacing:-.01em;color:#111;padding:0;margin:0 0 10px}
.m-ti::placeholder{color:#C7C7CC}
.m-tx{display:block;width:100%;border:0;outline:none;background:none;font-family:inherit;font-size:16px;line-height:1.65;color:#111;resize:none;padding:0;margin-top:4px;min-height:120px;overflow:hidden}
.m-tx::placeholder{color:#C7C7CC}
.ck .ck-in{flex:1;min-width:0;border:0;outline:none;background:none;font-family:inherit;font-size:16px;line-height:1.45;color:#111;padding:0}
.ck.on .ck-in{color:#9A9AA0;text-decoration:line-through}
.ck{cursor:default}
.ck > i{cursor:pointer}
.m-tool{flex:none;display:flex;justify-content:space-between;padding:8px calc(var(--px) - 4px) 0;background:#fff;border-top:1px solid #EFEFF2}
.m-tool button{border:0;background:none;padding:6px;cursor:pointer;display:flex}
.m-foot{flex:none;display:flex;align-items:center;justify-content:center;position:relative;height:44px;font-size:12px;color:#6C6C70;background:var(--ios-bg)}
.m-foot button{position:absolute;right:calc(var(--px) - 6px);top:6px;border:0;background:none;padding:6px;cursor:pointer;display:flex}

</style>
</head>

  <div id="caption"></div>
  <div id="phoneWrap">

            <div class="pc-msg" id="pcMsg"></div>
            <div class="keys" id="keys"></div>
            <div class="pc-bot"><button id="pcCancel">취소</button><button id="pcDel">삭제</button></div>
          </div>
          <div id="vApp" class="layer" hidden></div>
          <div id="vCall" class="layer" hidden></div>
          <div id="vBoot" class="layer" hidden><div class="ring"></div><div class="nm"></div></div>
          <div id="vOff" class="layer"><span>눌러서 전원 켜기</span></div>
          <div id="offCurtain"></div>
          <div id="status"><span class="t">2:07</span><span class="r"></span></div>
          <div id="island"></div>
          <div id="homebar" hidden><i></i></div>
        </div>
      </div>
    </div>
  </div>
  <div id="guide"></div>
  <div id="btnRow"><button id="offBtn" hidden><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5v5M3.6 3.6a5 5 0 1 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>화면 끄기</button></div>
</div>

<script>
(() => {

/* ═══════════ 기본 도구 ═══════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pad = n => String(n).padStart(2, "0");
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = DATA, SC = D.script, A = D.A;
const HAS_VOICE = typeof VOICES !== "undefined" && Object.keys(VOICES).length > 0;
const IMG = k => (typeof IMAGES !== "undefined" && IMAGES[k]) || "";

/* 날짜 계산 (하루 = 1440분) */
const dayIdx = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 864e5);
const isoIdx = iso => { const [y, m, d] = iso.split("-").map(Number); return dayIdx(y, m, d); };
const idxDate = i => { const t = new Date(i * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), w: t.getUTCDay() }; };
const toIso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const hm = s => { const [h, m] = String(s).split(":").map(Number); return h * 60 + (m || 0); };

const NOW0 = new Date();

const TD = idxDate(TODAY);
const START_MIN = REAL ? 0 : hm(D.clock.time);
const parseDivider = s => { const m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? dayIdx(+m[1], +m[2], +m[3]) : TODAY; };
const ampm = min => { min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min / 60), m = min % 60; return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${pad(m)}`; };
const dividerText = idx => { const t = idxDate(idx); return `${t.y}년 ${t.m}월 ${t.d}일 ${WD[t.w]}요일`; };

const nowTs = () => TODAY * 1440 + nowMin();

/* ═══════════ 모델 (대화 · 통화) ═══════════ */
function buildChat(c, app) {
  const items = []; let cur = TODAY;
  (c.messages || []).forEach(m => {
    if (m.date) { cur = parseDivider(m.date); items.push({ kind: "date", day: cur }); return; }

  });

}

const PW = 426, PH = 898;
function fit() {
  const st = $("#stage"); const cs = getComputedStyle(st);
  const availW = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = window.innerHeight - (D.page.caption ? 18 + 10 : 0) - 18 - 36 - 44;
  const s = Math.max(.3, Math.min(availW / PW, availH / PH, 1.2));
  S.scale = s;
  $("#phone").style.transform = `scale(${s})`;
  $("#phoneWrap").style.width = PW * s + "px"; $("#phoneWrap").style.height = PH * s + "px";
}

    const pl = D.map.saved[i]; S.map.sel = i;
    $$(".pin").forEach(p => p.classList.toggle("sel", +p.dataset.p === i));
    this.center(pl.x, pl.y, true);
    $("#mCard").innerHTML = `<div class="placecard"><div class="pt"><b>${esc(pl.name)}</b>${esc(pl.address)}</div><button class="pb">출발</button><button class="pb g">도착</button><button class="px" aria-label="닫기">${SV.close}</button></div>`;
  },
  center(x, y, ease) {
    const W = $("#world"); if (!W) return;
    const tx = Math.min(0, Math.max(402 - 2400, 201 - x)), ty = Math.min(0, Math.max(874 - 2400, 410 - y));
    S.map.tx = tx; S.map.ty = ty;
    W.classList.toggle("ease", !!ease && !RM);
    W.style.transform = `translate(${tx}px,${ty}px)`;
  },
  drag(p) {
    const V = $("#mapv", p), W = $("#world", p); let st = null;
    V.addEventListener("pointerdown", e => {
      if (e.target.closest(".pin")) { const i = +e.target.closest(".pin").dataset.p; S.map.pop = false; this.popup(); this.select(i); return; }
      st = { x: e.clientX, y: e.clientY, tx: S.map.tx, ty: S.map.ty, moved: false }; V.setPointerCapture(e.pointerId); V.classList.add("drag"); W.classList.remove("ease");
    });
    V.addEventListener("pointermove", e => {
      if (!st) return; const dx = (e.clientX - st.x) / S.scale, dy = (e.clientY - st.y) / S.scale;
      if (Math.abs(dx) + Math.abs(dy) > 3) st.moved = true;
      S.map.tx = Math.min(0, Math.max(402 - 2400, st.tx + dx)); S.map.ty = Math.min(0, Math.max(874 - 2400, st.ty + dy));
      W.style.transform = `translate(${S.map.tx}px,${S.map.ty}px)`;
    });
    const up = () => { if (st && !st.moved && S.map.pop) { S.map.pop = false; this.popup(); } st = null; V.classList.remove("drag"); };
    V.addEventListener("pointerup", up); V.addEventListener("pointercancel", up);
  }
};

/* ═══════════ 네이버 ═══════════ */
APPS.naver = {
  open() { S.naverView = "main"; this.main(null); },
  main(anim) {
    $("#vApp").classList.add("nv-bg");
    const w = S.weatherClear ? D.weather.after : D.weather.before;
    const hrs = [0, 1, 2, 3, 4].map(k => { const h = (Math.floor(nowMin() / 60) + k) % 24; return { h, t: w.temp - (k > 2 ? k - 2 : 0) }; });
    const SH = [["메일", "M4 6h16v12H4zM4 7l8 6 8-6"], ["카페", "M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2"], ["블로그", "M5 5h14v14H5zM9 9h6M9 13h4"], ["쇼핑", "M6 8h12l-1 11H7zM9 8a3 3 0 0 1 6 0"], ["뉴스", "M5 5h11v14H5zM16 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"], ["증권", "M4 18l5-6 4 3 7-8"], ["부동산", "M4 11l8-6 8 6v8H4zM10 19v-5h4v5"], ["웹툰", "M5 5h14v10H9l-4 4z"]];
    const p = pane(`<div class="top" style="background:#fff"><div class="nv-top">${navBack()}<div class="nv-search" id="nvS">${SV.search}<span>검색어를 입력해 주세요</span></div></div></div>
      <div class="scroll"><div style="background:#fff;padding-bottom:4px"><div class="nv-short">${SH.map(s => `<div><i><svg width="24" height="24" viewBox="0 0 24 24"><path d="${s[1]}" fill="none" stroke="#03B85A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i>${s[0]}</div>`).join("")}</div></div>
      <div style="height:12px"></div>
      <div class="nv-card"><div class="nv-w"><div><div style="font-size:13px;color:#555;font-weight:600">${esc(D.weather.place)} · 지금</div><div class="tp">${w.temp}°</div><div class="ds">${esc(w.text)} · 최고 ${w.hi}° 최저 ${w.lo}° · 미세먼지 ${esc(w.dust)}</div></div><div class="nvwx">${wxIcon(isClearWx(w))}</div></div>
        <div class="nv-h">${hrs.map((x, k) => `<div>${k ? (x.h < 12 ? "오전 " : "오후 ") + (x.h % 12 || 12) + "시" : "지금"}<br><b style="font-size:14px;color:#222">${x.t}°</b></div>`).join("")}</div></div>
      <div class="nv-card nv-news" ${D.naverNews.length ? "" : "hidden"}><h3>오늘의 소식</h3>${D.naverNews.map(n => `<a href="#" onclick="return false">${esc(n.title)}<small>${esc(n.src)}</small></a>`).join("")}</div><div style="height:30px"></div></div>`, anim);
    p.onclick = e => { if (e.target.closest("[data-act=back]")) { closeApp(); return; } if (e.target.closest("#nvS")) this.recent("push"); };
  },
  recent(anim) {
    S.naverView = "recent"; $("#vApp").classList.remove("nv-bg");
    const p = pane(`<div class="top"><div class="nv-top">${navBack()}<div class="nv-search">${SV.search}<input id="nvIn" placeholder="검색어를 입력해 주세요" autocomplete="off"></div></div></div>
      <div class="nv-rh"><b>최근 검색어</b><button data-act="all">전체삭제</button></div><div class="scroll" id="nvList"></div>`, anim);
    this.fill();
    setTimeout(() => { const i = $("#nvIn"); i && i.focus({ preventScroll: true }); }, 350);
    $("#nvIn").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) { const t = e.target.value.trim(); if (!t) return; S.naverRecent = S.naverRecent.filter(x => x !== t); S.naverRecent.push(t); e.target.value = ""; this.fill(); toast("지금은 검색 결과를 불러올 수 없어요"); } };
    p.onclick = e => {
      const a = e.target.closest("[data-act]");
      if (a && a.dataset.act === "back") { this.main("pop"); return; }
      if (a && a.dataset.act === "all") { if (!S.naverRecent.length) return; S.naverRecent = []; this.fill(); toast("최근 검색어를 모두 지웠어요"); return; }
      const d = e.target.closest("[data-del]"); if (d) { S.naverRecent.splice(+d.dataset.del, 1); this.fill(); }
    };
  },
  fill() {
    const L = $("#nvList"); if (!L) return; const R = S.naverRecent.map((t, i) => ({ t, i })).reverse();
    L.innerHTML = R.length ? R.map(({ t, i }, k) => `<div class="nv-r">${SV.search.replace("currentColor", "#BBB")}<span>${esc(t)}</span><time>${TD.m}.${pad(Math.max(1, TD.d - Math.floor(k / 2)))}.</time><button data-del="${i}" aria-label="${esc(t)} 삭제">${SV.close}</button></div>`).join("") : `<div class="nv-empty">최근 검색어가 없어요</div>`;
  }
};

/* ═══════════ 캘린더 ═══════════ */
APPS.calendar = {
  open() { S.cal = { y: TD.y, m: TD.m, sel: TODAY }; this.render(); },
  evs() { return D.calendar.events.map((e, k) => e.start ? { ...e, a: isoIdx(e.start), b: isoIdx(e.end), multi: true, k } : { ...e, a: isoIdx(e.date), b: isoIdx(e.date), multi: false, k }); },
  render() {
    const { y, m } = S.cal; const first = dayIdx(y, m, 1), fw = idxDate(first).w; const nd = dayIdx(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1) - first;
    const weeks = Math.ceil((fw + nd) / 7); const E = this.evs(); const H = D.calendar.holidays;
    let rows = "";
    for (let w = 0; w < weeks; w++) {
      const ws = first - fw + w * 7, we = ws + 6;
      let cells = "";
      for (let k = 0; k < 7; k++) {
        const di = ws + k, t = idxDate(di), iso = toIso(t.y, t.m, t.d);
        const single = E.some(e => !e.multi && e.a === di);
        const cls = [k === 0 ? "sun" : "", k === 6 ? "sat" : "", H[iso] ? "hol" : "", t.m !== m ? "out" : "", di === TODAY ? "today" : "", di === S.cal.sel ? "sel" : ""].join(" ");
        cells += `<button class="dc ${cls}" data-d="${di}" aria-label="${t.m}월 ${t.d}일"><span class="n">${t.d}</span>${single ? '<span class="dt"></span>' : ""}</button>`;
      }
      let bands = ""; let lane = 0;
      E.filter(e => e.multi && e.b >= ws && e.a <= we).forEach((e, n) => {
        const s0 = Math.max(e.a, ws) - ws, s1 = Math.min(e.b, we) - ws;
        bands += `<div class="band ${e.a < ws ? "cs" : ""} ${e.b > we ? "ce" : ""} ${e.k % 2 ? "c2" : ""}" style="left:calc(${s0} * 100% / 7 + 2px);width:calc(${s1 - s0 + 1} * 100% / 7 - 4px);top:${40 + lane * 17}px">${esc(e.title)}</div>`; lane++;
      });
      rows += `<div class="wk" style="height:${62 + Math.max(0, lane - 1) * 17}px">${cells}${bands}</div>`;
    }
    const sel = S.cal.sel, st = idxDate(sel), siso = toIso(st.y, st.m, st.d);
    const list = E.filter(e => e.a <= sel && e.b >= sel).sort((a, b) => (a.multi ? -1 : 0) - (b.multi ? -1 : 0) || hm(a.time || "0") - hm(b.time || "0"));
    const p = pane(`<div class="top"><div class="nav">${navBack(`${y}년`)}<span></span><button class="navbtn">${SV.search}</button></div>
      <div class="cal-h"><h2>${m}월</h2><div class="ctl"><button data-mv="-1" aria-label="이전 달">${SV.back.replace("currentColor", "#FF3B30")}</button><button data-mv="0">오늘</button><button data-mv="1" aria-label="다음 달"><span style="transform:scaleX(-1);display:flex">${SV.back.replace("currentColor", "#FF3B30")}</span></button></div></div>
      <div class="cal-wd">${WD.map(w => `<span>${w}</span>`).join("")}</div></div>
      <div class="scroll"><div class="cal-g">${rows}</div>
      <div class="cal-list"><h4>${st.m}월 ${st.d}일 ${WD[st.w]}요일${H[siso] ? `<span class="hn">${esc(H[siso])}</span>` : ""}</h4>
      ${list.length ? list.map(e => `<div class="ev ${e.k % 2 && e.multi ? "c2" : ""}"><i></i><div class="et">${e.multi || e.allDay ? "종일" : esc(ampm(hm(e.time)))}</div><div class="eb"><b>${esc(e.title)}</b>${e.place ? `<small>${esc(e.place)}</small>` : ""}${e.multi ? `<small>${e.place ? " · " : ""}${idxDate(e.a).m}/${idxDate(e.a).d} ~ ${idxDate(e.b).m}/${idxDate(e.b).d}</small>` : ""}</div></div>`).join("") : `<div class="cal-none">일정 없음</div>`}</div></div>`, null);
    p.querySelector(".back").style.color = "#FF3B30";
    p.onclick = e => {
      if (e.target.closest("[data-act=back]")) { closeApp(); return; }
      const mv = e.target.closest("[data-mv]");
      if (mv) { const d = +mv.dataset.mv; if (d === 0) S.cal = { y: TD.y, m: TD.m, sel: TODAY }; else { let nm = S.cal.m + d, ny = S.cal.y; if (nm < 1) { nm = 12; ny--; } if (nm > 12) { nm = 1; ny++; } S.cal.m = nm; S.cal.y = ny; S.cal.sel = dayIdx(ny, nm, 1); } this.render(); return; }
      const dc = e.target.closest(".dc"); if (dc) { const di = +dc.dataset.d, t = idxDate(di); S.cal.sel = di; if (t.m !== S.cal.m) { S.cal.m = t.m; S.cal.y = t.y; } this.render(); }
    };
  }
};

  Object.keys(typeof IMAGES !== "undefined" ? IMAGES : {}).forEach(k => { const i = new Image(); i.src = IMAGES[k]; });
  window.__S = S; // 점검용
}
init();
})();
